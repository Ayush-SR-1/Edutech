<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduByte - All Articles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f17;
      color: #94a3b8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Navigation Bar -->
  <nav class="border-b border-slate-800 bg-[#0b0f17]/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-8">
        <a href="index.html" class="text-xl font-bold text-white tracking-wide">EduByte</a>
        <div class="hidden md:flex space-x-6 text-sm font-medium">
          <a href="index.html" class="hover:text-white transition">Home</a>
          <a href="blogs.html" class="text-cyan-400 border-b-2 border-cyan-400 pb-1">Blogs</a>
          <a href="#" class="hover:text-white transition">Projects</a>
          <a href="#" class="hover:text-white transition">About</a>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <button class="text-slate-400 hover:text-white p-2">
          <i class="fa-regular fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
    
    <!-- Title & Interactive Filter Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">All Articles</h1>
        <p class="text-xs text-slate-400 mt-1">Explore all blog posts, tutorials, and tech insights.</p>
      </div>

      <!-- Live Search Bar -->
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-500"></i>
        <input type="text" id="searchInput" oninput="filterBlogs()" placeholder="Search articles..." class="w-full bg-slate-900 border border-slate-800 text-xs rounded-lg pl-9 pr-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500 transition">
      </div>
    </div>

    <!-- Category Filter Buttons -->
    <div class="flex items-center gap-2 mb-8 overflow-x-auto pb-2">
      <button onclick="filterCategory('ALL', this)" class="category-btn active bg-cyan-500 text-slate-950 font-semibold text-xs px-4 py-2 rounded-lg transition">All</button>
      <button onclick="filterCategory('AI & ML', this)" class="category-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs px-4 py-2 rounded-lg transition">AI & ML</button>
      <button onclick="filterCategory('Tech', this)" class="category-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs px-4 py-2 rounded-lg transition">Tech</button>
    </div>

    <!-- Dynamic Articles Grid -->
    <div id="blogs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-xs text-slate-500 col-span-full">Loading all articles...</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-slate-950/50 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <p>© 2026 EduByte. All rights reserved.</p>
      <div class="flex items-center space-x-6">
        <a href="index.html" class="hover:text-slate-400">Home</a>
        <a href="blogs.html" class="hover:text-slate-400">Blogs</a>
        <a href="#" class="hover:text-slate-400">Projects</a>
        <a href="#" class="hover:text-slate-400">About</a>
      </div>
    </div>
  </footer>

  <script>
    const API_BASE = 'https://edubyte-backend-x0up.onrender.com/api';
    let allPosts = [];
    let activeCategory = 'ALL';

    async function fetchAllBlogs() {
      try {
        const res = await fetch(`${API_BASE}/posts`);
        allPosts = await res.json();
        renderBlogs(allPosts);
      } catch (err) {
        document.getElementById('blogs-grid').innerHTML = `<p class="text-xs text-rose-400 col-span-full">Failed to load articles.</p>`;
      }
    }

    function renderBlogs(posts) {
      const grid = document.getElementById('blogs-grid');
      if (!posts || posts.length === 0) {
        grid.innerHTML = `<p class="text-xs text-slate-500 col-span-full">No articles found.</p>`;
        return;
      }

      grid.innerHTML = posts.map(post => `
        <a href="blog.html?id=${post._id}" class="bg-slate-900/60 border border-slate-800 rounded-xl p-5 hover:border-cyan-500/50 transition flex flex-col justify-between group">
          <div>
            <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-wider block mb-2">${post.category || 'AI & ML'}</span>
            <h3 class="text-base font-bold text-slate-100 group-hover:text-cyan-300 transition mb-2">${post.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-3 mb-4">${post.excerpt || 'Click to read full article...'}</p>
          </div>
          <div class="flex items-center justify-between text-[11px] text-slate-500 border-t border-slate-800/60 pt-3">
            <span>📅 ${post.date}</span>
            <span>⏱️ ${post.readTime}</span>
          </div>
        </a>
      `).join('');
    }

    function filterBlogs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allPosts.filter(p => {
        const matchesCategory = activeCategory === 'ALL' || (p.category && p.category.toLowerCase() === activeCategory.toLowerCase());
        const matchesSearch = p.title.toLowerCase().includes(query) || (p.excerpt && p.excerpt.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });
      renderBlogs(filtered);
    }

    function filterCategory(category, btnElement) {
      activeCategory = category;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = 'category-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs px-4 py-2 rounded-lg transition';
      });
      btnElement.className = 'category-btn active bg-cyan-500 text-slate-950 font-semibold text-xs px-4 py-2 rounded-lg transition';
      filterBlogs();
    }

    document.addEventListener('DOMContentLoaded', fetchAllBlogs);
  </script>
</body>
</html>
