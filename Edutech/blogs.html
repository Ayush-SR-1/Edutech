<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduByte - All Blogs & Tech Insights</title>
  
  <meta name="description" content="Explore articles, tutorials, and deep dives on AI, ML, Prompt Engineering, and Software Development by Ayush Singh Rathor.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="EduByte - Blogs & Tech Insights">
  <meta property="og:description" content="Deep dives into AI myths, LLMs, prompt engineering, and modern tech trends.">
  <meta property="og:image" content="https://ayush-sr-1.github.io/Edutech/preview.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Font Awesome CDN 6.5.2 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .dark body { background-color: #070b12; color: #94a3b8; }
    .dark .bg-surface { background-color: #070b12; }
    .dark .bg-card { background-color: rgba(13, 19, 33, 0.75); backdrop-filter: blur(12px); }
    .dark .border-color { border-color: rgba(255, 255, 255, 0.08); }
    .dark .text-main { color: #f8fafc; }
    .dark .text-sub { color: #cbd5e1; }

    html:not(.dark) body { background-color: #f8fafc; color: #334155; }
    html:not(.dark) .bg-surface { background-color: #ffffff; }
    html:not(.dark) .bg-card { background-color: #ffffff; }
    html:not(.dark) .border-color { border-color: #e2e8f0; }
    html:not(.dark) .text-main { color: #0f172a; }
    html:not(.dark) .text-sub { color: #475569; }

    .tab-btn {
      color: #94a3b8;
      background: transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background-color: #06b6d4;
      color: #020617;
      font-weight: 700;
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between transition-colors duration-200">

  <!-- Ambient Glow -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-cyan-600/10 rounded-full filter blur-[120px] pointer-events-none"></div>

  <!-- Navigation Bar -->
  <nav class="border-b border-color bg-surface/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-8">
        <a href="index.html" class="text-xl font-black text-main tracking-wide flex items-center gap-2">
          <span class="w-7 h-7 rounded-lg bg-cyan-400 text-slate-950 flex items-center justify-center font-extrabold text-sm">E</span>
          Edu<span class="text-cyan-500">Byte</span>
        </a>
        <div class="hidden md:flex space-x-6 text-sm font-medium text-sub">
          <a href="index.html" class="hover:text-main transition">Home</a>
          <a href="blogs.html" class="text-cyan-500 border-b-2 border-cyan-500 pb-1 font-semibold">Blogs</a>
          <a href="#" class="hover:text-main transition">About</a>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <!-- Admin Toggle Button -->
        <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-xl border border-color text-xs font-semibold text-sub hover:text-main transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-shield text-cyan-400"></i> <span id="admin-status-text">Admin</span>
        </button>

        <!-- Social Icons -->
        <a href="https://github.com/ayush-sr-1" target="_blank" rel="noopener noreferrer" class="text-sub hover:text-main p-2 transition" aria-label="GitHub">
          <i class="fa-brands fa-github text-base"></i>
        </a>
        <button id="theme-toggle" onclick="toggleTheme()" class="text-sub hover:text-main p-2 rounded-xl border border-color transition">
          <i id="theme-toggle-icon" class="fa-regular fa-sun text-yellow-400"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-12">
    
    <!-- Top Reader Picks / Highlights Section -->
    <section class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-color/40 pb-6">
        <div>
          <span class="text-[11px] font-mono font-bold tracking-widest text-cyan-500 uppercase">CURATED HIGHLIGHTS</span>
          <h1 class="text-3xl sm:text-4xl font-black text-main tracking-tight mt-1">Top Reader Picks</h1>
        </div>

        <!-- Segmented Control Switcher -->
        <div class="flex items-center p-1.5 bg-[#0b1322] border border-cyan-500/20 rounded-2xl w-fit">
          <button id="tab-latest" onclick="switchHighlightTab('latest')" class="tab-btn active text-xs px-4 py-2 font-medium flex items-center gap-2">
            <i class="fa-solid fa-clock text-[11px]"></i> Latest
          </button>
          <button id="tab-viewed" onclick="switchHighlightTab('viewed')" class="tab-btn text-xs px-4 py-2 font-medium flex items-center gap-2">
            <i class="fa-solid fa-fire text-[11px]"></i> Most Viewed
          </button>
          <button id="tab-liked" onclick="switchHighlightTab('liked')" class="tab-btn text-xs px-4 py-2 font-medium flex items-center gap-2">
            <i class="fa-solid fa-heart text-[11px]"></i> Most Liked
          </button>
        </div>
      </div>

      <!-- Highlights Stacked List Container -->
      <div id="highlights-container" class="space-y-4"></div>
    </section>

    <!-- Search Controls -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-card p-4 rounded-2xl border border-color">
      <div class="flex items-center gap-2 overflow-x-auto pb-2 sm:pb-0">
        <button onclick="filterCategory('All')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-cyan-500 text-slate-950">All</button>
        <button onclick="filterCategory('AI & ML')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-surface text-sub border border-color hover:text-main">AI & ML</button>
        <button onclick="filterCategory('Tech & Design')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-surface text-sub border border-color hover:text-main">Tech & Design</button>
      </div>
      <div class="relative w-full sm:w-64">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-sub"></i>
        <input id="search-input" type="text" oninput="handleSearch()" placeholder="Filter articles..." class="w-full bg-surface border border-color text-xs rounded-xl pl-8 pr-4 py-2 text-main focus:outline-none focus:border-cyan-500">
      </div>
    </div>

    <!-- Articles Section -->
    <section class="space-y-4">
      <h2 class="text-lg font-bold text-main">All Articles</h2>
      <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-color bg-surface/80 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-sub">
      <p>© 2026 EduByte. All rights reserved.</p>
      <div class="flex items-center space-x-6">
        <a href="index.html" class="hover:text-main transition">Home</a>
        <a href="blogs.html" class="hover:text-main transition">Blogs</a>
        <a href="https://github.com/ayush-sr-1" target="_blank" rel="noopener noreferrer" class="hover:text-main transition flex items-center gap-1.5">
          <i class="fa-brands fa-github"></i> GitHub
        </a>
      </div>
    </div>
  </footer>

  <script>
    const API_BASE = 'https://edubyte-backend-x0up.onrender.com/api';
    let currentCategory = 'All';
    let currentHighlightTab = 'latest';

    const fetchWithTimeout = (url, timeoutMs = 5000) => 
      Promise.race([
        fetch(url),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Network Timeout')), timeoutMs))
      ]);

    const staticFallbackPosts = [
      {
        _id: 'sample-1',
        title: "Why Does AI \"Lie\"? Understanding Hallucination in Large Language Models",
        excerpt: "An exploration into why confident AI models generate false citations, made-up facts, and plausible-sounding errors—and how to handle them.",
        category: "AI & ML",
        date: "Aug 30, 2026",
        readTime: "7 min read",
        views: 18200,
        likes: 1450,
        createdAt: "2026-08-30T10:00:00.000Z"
      },
      {
        _id: 'sample-2',
        title: "AI Myths and Facts: Separating What's Real from the Hype",
        excerpt: "From JEE preparation to AI prompts, exploring the reality of Artificial Intelligence behind sci-fi tropes, hallucinations, and mainstream hype.",
        category: "AI & ML",
        date: "Aug 27, 2026",
        readTime: "6 min read",
        views: 24500,
        likes: 1890,
        createdAt: "2026-08-27T10:00:00.000Z"
      },
      {
        _id: 'sample-3',
        title: "Can We Trust AI-Generated Information?",
        excerpt: "From courtroom errors to invented book lists and Google AI Overviews, exploring real-world case studies of why confident AI fluency isn't the same as truth.",
        category: "AI & ML",
        date: "Sep 2, 2026",
        readTime: "8 min read",
        views: 12900,
        likes: 920,
        createdAt: "2026-09-02T08:00:00.000Z"
      },
      {
        _id: 'sample-4',
        title: "Can AI Actually Be Creative?",
        excerpt: "Exploring neural networks, generative art, music synthesis, and whether statistical pattern matching constitutes true human-like creativity.",
        category: "AI & ML",
        date: "Sep 5, 2026",
        readTime: "7 min read",
        views: 15400,
        likes: 1120,
        createdAt: "2026-09-05T10:00:00.000Z"
      }
    ];

    const DATE_OVERRIDES = {
      "Why Does AI \"Lie\"? Understanding Hallucination in Large Language Models": "Aug 30, 2026",
      "Why Does AI \"Lie\"? Understanding Hallucination in LLMs": "Aug 30, 2026",
      "AI Myths and Facts: Separating What's Real from the Hype": "Aug 27, 2026",
      "Can We Trust AI-Generated Information?": "Sep 2, 2026",
      "Can AI Actually Be Creative?": "Sep 5, 2026"
    };

    function normalizePosts(posts) {
      if (!posts) return [];
      return posts.map(p => {
        const titleKey = p.title ? p.title.trim() : '';
        if (DATE_OVERRIDES[titleKey]) {
          return { ...p, date: DATE_OVERRIDES[titleKey] };
        }
        return p;
      });
    }

    let allPosts = normalizePosts(staticFallbackPosts);

    function isAdmin() {
      return localStorage.getItem('edubyte_admin_mode') === 'true';
    }

    function updateAdminUI() {
      const statusText = document.getElementById('admin-status-text');
      const btn = document.getElementById('admin-toggle-btn');
      if (isAdmin()) {
        statusText.innerText = 'Admin ON';
        btn.className = 'px-3 py-1.5 rounded-xl border border-cyan-500/50 bg-cyan-500/10 text-xs font-bold text-cyan-400 transition flex items-center gap-1.5';
      } else {
        statusText.innerText = 'Admin';
        btn.className = 'px-3 py-1.5 rounded-xl border border-color text-xs font-semibold text-sub hover:text-main transition flex items-center gap-1.5';
      }
    }

    function toggleAdminMode() {
      if (!isAdmin()) {
        const pass = prompt("Enter Admin Passcode:");
        if (pass === "admin123") {
          localStorage.setItem('edubyte_admin_mode', 'true');
          alert("Admin Mode Activated!");
        } else if (pass !== null) {
          alert("Incorrect Passcode!");
        }
      } else {
        localStorage.setItem('edubyte_admin_mode', 'false');
        alert("Admin Mode Deactivated.");
      }
      updateAdminUI();
      renderHighlights();
    }

    function formatCount(num) {
      const n = Number(num);
      if (isNaN(n)) return '0';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return n.toString();
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-toggle-icon');
      if (icon) {
        icon.className = isDark ? 'fa-regular fa-sun text-yellow-400' : 'fa-regular fa-moon text-slate-700';
      }
    }

    async function loadBlogsPage() {
      allPosts = normalizePosts(allPosts);
      renderHighlights();
      renderArticles(allPosts);

      try {
        const res = await fetchWithTimeout(`${API_BASE}/posts`, 5000);
        if (res.ok) {
          const livePosts = await res.json();
          if (livePosts && livePosts.length > 0) {
            allPosts = normalizePosts(livePosts);
            renderHighlights();
            renderArticles(allPosts);
          }
        }
      } catch (err) {
        console.warn('API connection timed out or failed. Displayed static backup.');
      }
    }

    function switchHighlightTab(tab) {
      currentHighlightTab = tab;
      
      const tabs = ['latest', 'viewed', 'liked'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = 'tab-btn active text-xs px-4 py-2 font-medium flex items-center gap-2';
        } else {
          btn.className = 'tab-btn text-xs px-4 py-2 font-medium flex items-center gap-2 text-sub hover:text-main';
        }
      });

      renderHighlights();
    }

    function renderHighlights() {
      const container = document.getElementById('highlights-container');
      let sortedPosts = [...allPosts];

      if (currentHighlightTab === 'latest') {
        sortedPosts.sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));
      } else if (currentHighlightTab === 'liked') {
        sortedPosts.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (currentHighlightTab === 'viewed') {
        sortedPosts.sort((a, b) => (b.views || 0) - (a.views || 0));
      }

      const top3 = sortedPosts.slice(0, 3);

      if (top3.length === 0) {
        container.innerHTML = '<div class="text-xs text-sub p-4 border border-color rounded-2xl bg-card">No highlight posts available.</div>';
        return;
      }

      container.innerHTML = top3.map((p, idx) => {
        let badgeLabel = '';
        let badgeStyle = '';

        if (currentHighlightTab === 'viewed') {
          badgeLabel = '🔥 MOST VIEWED';
          badgeStyle = 'bg-amber-500/10 border-amber-500/30 text-amber-400';
        } else if (currentHighlightTab === 'liked') {
          badgeLabel = '❤️ MOST LIKED';
          badgeStyle = 'bg-rose-500/10 border-rose-500/30 text-rose-400';
        } else {
          badgeLabel = '✨ LATEST';
          badgeStyle = 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400';
        }

        const categoryClass = p.category === 'Tech & Design' ? 'text-rose-400' : 'text-cyan-400';

        return `
          <a href="blog.html?id=${p._id}" class="group block p-6 sm:p-7 rounded-2xl bg-[#090f1d]/80 border border-cyan-500/10 hover:border-cyan-500/30 transition duration-300 relative">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold ${categoryClass}">${p.category || 'AI & ML'}</span>
              ${idx === 0 ? `
                <span class="border ${badgeStyle} text-[10px] font-extrabold px-3 py-1 rounded-full flex items-center gap-1.5 uppercase tracking-wider">
                  ${badgeLabel}
                </span>
              ` : ''}
            </div>

            <h2 class="text-xl sm:text-2xl font-bold text-main group-hover:text-cyan-400 transition mb-2 tracking-tight">${p.title}</h2>
            <p class="text-xs sm:text-sm text-slate-400 line-clamp-2 mb-6 font-normal leading-relaxed">${p.excerpt || ''}</p>

            <div class="flex items-center justify-between text-xs text-slate-400 pt-2">
              <span>${p.date || 'Sep 10, 2026'}</span>
              <span class="flex items-center gap-2 font-medium text-cyan-400 group-hover:translate-x-1 transition">
                <span><i class="fa-regular fa-eye text-cyan-400 mr-1"></i>${formatCount(p.views || 0)} views</span> • 
                <span><i class="fa-solid fa-heart text-rose-500 mr-1"></i>${formatCount(p.likes || 0)} likes</span> • 
                <span>${p.readTime || '7 min read'} →</span>
              </span>
            </div>
          </a>
        `;
      }).join('');
    }

    function renderArticles(posts) {
      const container = document.getElementById('articles-container');
      const searchVal = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = posts.filter(p => {
        const matchesCat = currentCategory === 'All' || p.category === currentCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchVal) || (p.excerpt && p.excerpt.toLowerCase().includes(searchVal));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-span-full p-8 text-center text-xs text-sub border border-color rounded-2xl bg-card">No articles found matching your criteria.</div>';
        return;
      }

      container.innerHTML = filtered.map(p => `
        <a href="blog.html?id=${p._id}" class="group flex flex-col justify-between p-5 rounded-2xl bg-card border border-color hover:border-cyan-500/40 transition duration-200">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold text-cyan-500 uppercase">${p.category || 'AI & ML'}</span>
              <span class="text-[10px] text-sub">${p.readTime || '5 min read'}</span>
            </div>
            <h3 class="text-sm font-bold text-main group-hover:text-cyan-400 transition mb-2 line-clamp-2">${p.title}</h3>
            <p class="text-xs text-sub line-clamp-2 mb-4 leading-relaxed">${p.excerpt || ''}</p>
          </div>
          <div class="flex items-center justify-between text-[10px] text-sub pt-3 border-t border-color">
            <span>${p.date || 'Sep 2026'}</span>
            <span class="text-cyan-500 font-semibold flex items-center gap-1">Read <i class="fa-solid fa-chevron-right text-[8px]"></i></span>
          </div>
        </a>
      `).join('');
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.innerText.trim() === cat) {
          btn.className = 'cat-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-cyan-500 text-slate-950';
        } else {
          btn.className = 'cat-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-surface text-sub border border-color hover:text-main';
        }
      });
      renderArticles(allPosts);
    }

    function handleSearch() {
      renderArticles(allPosts);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      updateAdminUI();
      loadBlogsPage();
    });
  </script>
</body>
</html>
