<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduByte — Tech & AI Insights</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center p-6">

  <!-- Header -->
  <header class="w-full max-w-4xl flex justify-between items-center py-6 border-b border-slate-800 mb-8">
    <h1 class="text-3xl font-bold tracking-wide text-cyan-400">EduByte</h1>
    <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold">Tech & AI Insights</span>
  </header>

  <!-- Main Feed Container -->
  <main id="posts-container" class="w-full max-w-4xl space-y-12">
    <div id="loading" class="text-center py-12 text-slate-400">
      <p class="animate-pulse text-lg">Fetching posts from database...</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-4xl text-center py-8 border-t border-slate-800 text-slate-500 text-sm mt-12">
    © 2026 Ayush Singh Rathor • EduByte
  </footer>

  <!-- Frontend Logic -->
  <script>
    const API_URL = "https://edubyte-backend-x0up.onrender.com/api/posts";

    // Fetch and display posts
    async function loadPosts() {
      const container = document.getElementById("posts-container");
      try {
        const response = await fetch(API_URL);
        const posts = await response.json();

        if (!posts || posts.length === 0) {
          container.innerHTML = `<div class="text-center py-12 text-slate-400">No posts available.</div>`;
          return;
        }

        container.innerHTML = posts.map(post => `
          <article class="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 shadow-xl">
            <!-- Title & Metadata -->
            <h2 class="text-2xl sm:text-3xl font-bold text-white mb-3">${post.title}</h2>
            <div class="flex flex-wrap items-center gap-3 text-sm text-cyan-400 mb-6">
              <span>By ${post.author}</span>
              <span>•</span>
              <span class="bg-slate-800 px-2.5 py-1 rounded text-xs text-slate-300">${post.category}</span>
              <span>•</span>
              <span class="text-slate-400">${post.readTime}</span>
              <span>•</span>
              <span class="text-slate-400">${post.date}</span>
            </div>

            <!-- Excerpt -->
            <p class="text-slate-300 italic mb-6 border-l-4 border-cyan-500 pl-4 py-1 bg-slate-950/40 rounded-r">
              ${post.excerpt}
            </p>

            <!-- Main Post HTML Content -->
            <div class="prose prose-invert max-w-none text-slate-200 space-y-4 mb-8 leading-relaxed">
              ${post.content}
            </div>

            <!-- Interactions: Likes & Views -->
            <div class="flex items-center justify-between pt-6 border-t border-slate-800 text-sm">
              <button onclick="likePost('${post._id}')" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-pink-400 px-4 py-2 rounded-lg transition-colors">
                ❤️ <span>Like</span> (<span id="likes-${post._id}">${post.likes || 0}</span>)
              </button>
              <span class="text-slate-500">👁️ ${post.views || 0} views</span>
            </div>

            <!-- Comment Section -->
            <section class="mt-8 pt-6 border-t border-slate-800">
              <h3 class="text-lg font-semibold text-white mb-4">Comments (${post.comments ? post.comments.length : 0})</h3>
              
              <!-- Existing Comments -->
              <div class="space-y-3 mb-6">
                ${post.comments && post.comments.length > 0 ? post.comments.map(c => `
                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800/80 text-sm">
                    <p class="font-bold text-cyan-400">${c.author}</p>
                    <p class="text-slate-300 mt-1">${c.content}</p>
                  </div>
                `).join('') : '<p class="text-slate-500 text-xs italic">No comments yet. Be the first!</p>'}
              </div>

              <!-- New Comment Form -->
              <form onsubmit="submitComment(event, '${post._id}')" class="space-y-3">
                <input type="text" id="author-${post._id}" placeholder="Your Name" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                <textarea id="comment-${post._id}" placeholder="Add a comment..." required rows="2" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500"></textarea>
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-4 py-2 rounded text-sm transition-colors">Submit Comment</button>
              </form>
            </section>
          </article>
        `).join('');

      } catch (err) {
        console.error("Failed to load posts:", err);
        container.innerHTML = `<div class="text-center py-12 text-red-400">Failed to load posts. Please try again later.</div>`;
      }
    }

    // Handle Likes
    async function likePost(id) {
      try {
        const res = await fetch(`${API_URL}/${id}/like`, { method: "POST" });
        if (res.ok) {
          const updatedPost = await res.json();
          document.getElementById(`likes-${id}`).innerText = updatedPost.likes;
        }
      } catch (err) {
        console.error("Like failed:", err);
      }
    }

    // Handle Comment Submissions
    async function submitComment(event, id) {
      event.preventDefault();
      const author = document.getElementById(`author-${id}`).value;
      const content = document.getElementById(`comment-${id}`).value;

      try {
        const res = await fetch(`${API_URL}/${id}/comment`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ author, content })
        });
        if (res.ok) {
          loadPosts(); // Reload page to render new comment
        }
      } catch (err) {
        console.error("Comment failed:", err);
      }
    }

    // Initialize on page load
    loadPosts();
  </script>
</body>
</html>
