<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduByte — Tech & AI Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#0B1317',
                        ink: '#F4F1EA',
                        muted: '#6B828D'
                    },
                    fontFamily: {
                        serif: ['Newsreader', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #050A0E; 
            color: #F4F1EA; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        #grid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .blog-content { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            line-height: 1.8; 
            color: #D1E0E5; 
            font-size: 1.05rem; 
        }
        .blog-content p { margin-bottom: 1.5rem; }
        .blog-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 2rem auto; display: block; }
        .blog-content h1, .blog-content h2, .blog-content h3 { 
            font-family: 'Newsreader', serif; 
            color: #FFFFFF; 
            font-weight: 600; 
            margin-top: 2.5rem; 
            margin-bottom: 1rem; 
        }
        .blog-content h2 { font-size: 1.85rem; }
        .blog-content code { background: #121F24; color: #38BDF8; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .blog-content pre { background: #080D10; color: #F4F1EA; padding: 1.25rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid #1B2E36; }
        .blog-content pre code { background: transparent; color: inherit; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-cyan-900 selection:text-white">

    <canvas id="grid-canvas"></canvas>

    <div class="relative z-10 max-w-4xl mx-auto px-6 py-10 md:py-16 w-full flex-1">
        
        <!-- MAIN FEED VIEW -->
        <div id="feed-view">
            <header class="flex justify-between items-center mb-12 pb-6 border-b border-cyan-950/80 backdrop-blur-sm">
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-xs uppercase font-mono tracking-wider text-muted hover:text-cyan-400 transition">← Profile</a>
                    <span class="text-cyan-900">•</span>
                    <h1 class="font-serif text-2xl font-semibold tracking-tight text-white">EduByte</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="toggleOwnerMode()" id="owner-badge" class="text-[10px] font-mono border border-cyan-900 text-slate-500 px-2 py-0.5 rounded hover:border-cyan-500 transition">Admin Mode</button>
                    <span class="text-xs uppercase tracking-widest text-muted font-medium">Tech & AI Insights</span>
                </div>
            </header>

            <main id="feed-container">
                <div class="animate-pulse space-y-8 py-10">
                    <div class="h-4 bg-cyan-950/40 rounded w-1/4"></div>
                    <div class="h-10 bg-cyan-950/40 rounded w-3/4"></div>
                    <div class="h-20 bg-cyan-950/40 rounded w-full"></div>
                </div>
            </main>
        </div>

        <!-- FULL PAGE ARTICLE VIEW -->
        <article id="article-view" class="hidden">
            <div class="mb-8 pb-4 border-b border-cyan-900/40 flex items-center justify-between">
                <button onclick="showFeedView()" class="inline-flex items-center gap-2 text-sm font-semibold text-cyan-400 hover:text-white transition">
                    ← Back to all articles
                </button>
                <a href="index.html" class="text-xs font-mono uppercase text-muted hover:text-white">Main Profile</a>
            </div>

            <div class="bg-[#0A1115]/90 border border-cyan-900/60 shadow-2xl rounded-xl p-6 md:p-12 backdrop-blur-md">
                <header id="article-header" class="mb-10"></header>

                <div id="article-body" class="blog-content mb-12 border-b border-cyan-900/40 pb-12"></div>

                <section class="max-w-2xl mx-auto space-y-8">
                    <div class="flex items-center justify-between bg-cyan-950/30 border border-cyan-900/40 p-4 rounded-lg">
                        <button id="like-btn" class="flex items-center gap-2 border border-cyan-800/50 hover:border-cyan-600 bg-cyan-950/60 px-5 py-2 rounded-full text-sm font-medium transition text-cyan-200">
                            <span>❤️</span> <span id="like-count">0</span> Likes
                        </button>
                        <span id="view-count" class="text-xs text-muted font-mono">0 views</span>
                    </div>

                    <div class="space-y-6 pt-4">
                        <h3 class="font-serif text-2xl font-semibold text-white">Discussion</h3>
                        <div id="comments-list" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div>

                        <form id="comment-form" onsubmit="submitComment(event)" class="flex flex-col gap-3 bg-cyan-950/20 border border-cyan-900/40 p-4 rounded-lg">
                            <input type="text" id="comment-user" placeholder="Your name (optional)" class="bg-cyan-950/40 border border-cyan-900/60 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                            <div class="flex gap-2">
                                <input type="text" id="comment-text" placeholder="Write a comment..." required class="flex-1 bg-cyan-950/40 border border-cyan-900/60 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                                <button type="submit" class="bg-cyan-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-cyan-500 transition">Post</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </article>

    </div>

    <footer class="relative z-10 max-w-4xl mx-auto px-6 py-8 w-full border-t border-cyan-950/60 flex justify-between items-center text-xs text-muted font-mono">
        <span>© 2026 Ayush Singh Rathor</span>
        <a href="index.html" class="hover:underline">Profile Page</a>
    </footer>

    <script>
        const canvas = document.getElementById('grid-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let time = 0;

        function drawWaveGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#03070A');
            bgGradient.addColorStop(0.5, '#060D12');
            bgGradient.addColorStop(1, '#020507');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            time += 0.012;

            const rows = 28;
            const cols = 48;
            const horizonY = canvas.height * 0.42;
            const gridHeight = canvas.height - horizonY;
            const centerX = canvas.width / 2;

            let gridPoints = [];

            for (let r = 0; r <= rows; r++) {
                gridPoints[r] = [];
                let normY = r / rows;
                let perspectiveY = Math.pow(normY, 2.5);
                let baseY = horizonY + perspectiveY * gridHeight;

                for (let c = 0; c <= cols; c++) {
                    let normX = (c - cols / 2) / (cols / 2);
                    let baseX = centerX + normX * (canvas.width * 0.85) * (0.2 + 0.8 * normY);

                    let wave1 = Math.sin(normX * 5 + time + normY * 3) * 18 * normY;
                    let wave2 = Math.cos(normY * 8 - time * 1.5) * 14 * normY;
                    let waveHeight = wave1 + wave2;

                    gridPoints[r][c] = {
                        x: baseX,
                        y: baseY + waveHeight,
                        alpha: normY * 0.45
                    };
                }
            }

            ctx.lineWidth = 0.9;

            for (let r = 0; r <= rows; r++) {
                let rowAlpha = gridPoints[r][0].alpha;
                ctx.strokeStyle = `rgba(56, 189, 248, ${rowAlpha})`;
                ctx.beginPath();
                for (let c = 0; c <= cols; c++) {
                    let pt = gridPoints[r][c];
                    if (c === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
            }

            for (let c = 0; c <= cols; c += 2) {
                ctx.beginPath();
                for (let r = 0; r <= rows; r++) {
                    let pt = gridPoints[r][c];
                    ctx.strokeStyle = `rgba(30, 120, 150, ${pt.alpha * 0.7})`;
                    if (r === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(drawWaveGrid);
        }
        drawWaveGrid();

        const API_URL = 'https://edubyte-backend-x0up.onrender.com';
        let currentPosts = [];
        let activePostId = null;

        // Header helper for owner key
        function getHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const ownerKey = localStorage.getItem('edubyte_owner_key');
            if (ownerKey) {
                headers['x-owner-key'] = ownerKey;
            }
            return headers;
        }

        function toggleOwnerMode() {
            const existingKey = localStorage.getItem('edubyte_owner_key');
            if (existingKey) {
                localStorage.removeItem('edubyte_owner_key');
                alert("Owner mode disabled.");
                updateOwnerBadge();
            } else {
                const key = prompt("Enter owner secret key:");
                if (key) {
                    localStorage.setItem('edubyte_owner_key', key);
                    alert("Owner mode activated!");
                    updateOwnerBadge();
                }
            }
        }

        function updateOwnerBadge() {
            const badge = document.getElementById('owner-badge');
            if (localStorage.getItem('edubyte_owner_key')) {
                badge.innerText = "Admin: ACTIVE";
                badge.className = "text-[10px] font-mono border border-emerald-500 text-emerald-400 px-2 py-0.5 rounded cursor-pointer";
            } else {
                badge.innerText = "Admin Mode";
                badge.className = "text-[10px] font-mono border border-cyan-900 text-slate-500 px-2 py-0.5 rounded cursor-pointer hover:border-cyan-500 transition";
            }
        }

        function sanitizeBlogHtml(htmlStr) {
            if (!htmlStr) return '';
            return htmlStr
                .replace(/\\n/g, ' ')
                .replace(/\\"/g, '"')
                .replace(/style="[^"]*"/gi, '')
                .trim();
        }

        function cleanSnippetText(text) {
            if (!text) return '';
            return text
                .replace(/^.*?---/g, '')
                .replace(/Ayush Singh Rathor.*?(VIT|student)/gi, '')
                .replace(/^.*?\?--/g, '')
                .replace(/^[\s\-–—:\.]+/g, '')
                .trim();
        }

        async function fetchPosts() {
            const container = document.getElementById('feed-container');
            try {
                const res = await fetch(`${API_URL}/api/posts`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();
                if (data.success && data.posts.length > 0) {
                    currentPosts = data.posts;
                    renderEditorialLayout(data.posts);
                    checkUrlForPost();
                } else {
                    container.innerHTML = `<p class="text-muted font-serif py-10 text-center">No posts available.</p>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="text-center py-12 space-y-3">
                        <p class="text-slate-300 font-serif text-lg">Unable to load feed from server.</p>
                        <p class="text-xs text-slate-500 font-mono">${err.message}</p>
                        <button onclick="fetchPosts()" class="bg-cyan-600 text-white text-xs px-4 py-2 rounded-md hover:bg-cyan-500 transition">Retry</button>
                    </div>
                `;
            }
        }

        function renderEditorialLayout(posts) {
            const container = document.getElementById('feed-container');
            const featured = posts[0];
            const featuredComments = (featured.comments || []).length;

            let html = `
                <!-- Featured Entry -->
                <section class="mb-16 bg-[#081014]/60 backdrop-blur-md border border-cyan-900/40 p-8 rounded-2xl hover:border-cyan-600/60 transition shadow-xl">
                    <div class="cursor-pointer group" onclick="openFullArticle('${featured.id}')">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                            <span class="text-xs text-cyan-400 uppercase tracking-wider font-mono">Latest Entry</span>
                        </div>
                        <h2 class="font-serif text-4xl md:text-5xl font-semibold leading-tight tracking-tight mb-4 text-white group-hover:text-cyan-300 transition">${featured.title}</h2>
                        <p class="text-slate-300 text-lg font-serif italic mb-6 max-w-2xl">${cleanSnippetText(featured.snippet)}</p>
                    </div>
                    
                    <div class="flex items-center justify-between text-xs text-muted pt-4 border-t border-cyan-950/80">
                        <div class="flex items-center gap-3">
                            <button onclick="openFullArticle('${featured.id}')" class="text-cyan-400 hover:underline font-medium">Read article →</button>
                            <span>•</span>
                            <span class="bg-cyan-950/80 border border-cyan-800/50 px-2.5 py-1 rounded-full text-cyan-200 font-sans">${featured.category}</span>
                        </div>

                        <div class="flex items-center gap-2 font-mono text-xs">
                            <button onclick="inlineLike('${featured.id}', event)" class="flex items-center gap-1.5 px-3 py-1 bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-800/50 rounded-full text-cyan-200 transition">
                                <span>❤️</span> <span id="feed-likes-${featured.id}">${featured.likes || 0}</span>
                            </button>
                            <span class="text-slate-500 px-1">👁️ ${featured.views || 0}</span>
                            <button onclick="toggleQuickComment('${featured.id}', event)" class="flex items-center gap-1.5 px-3 py-1 bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-800/50 rounded-full text-cyan-200 transition">
                                <span>💬</span> <span id="feed-comments-count-${featured.id}">${featuredComments}</span>
                            </button>
                        </div>
                    </div>

                    <div id="quick-comment-box-${featured.id}" class="hidden mt-4 pt-4 border-t border-cyan-950/80">
                        <form onsubmit="submitQuickComment(event, '${featured.id}')" class="flex flex-col gap-2 bg-cyan-950/30 p-3 rounded-lg border border-cyan-900/40">
                            <input type="text" id="quick-user-${featured.id}" placeholder="Your name (optional)" class="bg-cyan-950/60 border border-cyan-900/60 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                            <div class="flex gap-2">
                                <input type="text" id="quick-text-${featured.id}" placeholder="Write a comment..." required class="flex-1 bg-cyan-950/60 border border-cyan-900/60 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded text-xs transition">Send</button>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- All Entries List -->
                <section>
                    <h3 class="text-xs uppercase tracking-widest text-muted font-medium mb-8 pb-3 border-b border-cyan-900/40">All entries</h3>
                    <div class="space-y-6">
            `;

            posts.forEach((post, idx) => {
                const num = String(idx + 1).padStart(2, '0');
                const commentCount = (post.comments || []).length;
                html += `
                    <article class="bg-[#081014]/40 backdrop-blur-sm border border-cyan-950/60 p-6 rounded-xl hover:border-cyan-800/60 transition">
                        <div class="flex gap-6 items-start cursor-pointer group" onclick="openFullArticle('${post.id}')">
                            <span class="font-serif text-cyan-500/60 text-lg md:text-xl font-light w-6 shrink-0">${num}</span>
                            <div class="space-y-2 flex-1">
                                <h4 class="font-serif text-2xl md:text-3xl font-semibold leading-snug text-white group-hover:text-cyan-300 transition">${post.title}</h4>
                                <p class="text-slate-400 text-sm md:text-base font-serif italic">${cleanSnippetText(post.snippet)}</p>
                            </div>
                        </div>

                        <div class="pt-4 mt-3 flex items-center justify-between border-t border-cyan-950/60 pl-12">
                            <span class="inline-block bg-cyan-950/60 border border-cyan-900/40 px-2.5 py-0.5 rounded-full text-xs text-cyan-300">${post.category}</span>
                            
                            <div class="flex items-center gap-2 font-mono text-xs">
                                <button onclick="inlineLike('${post.id}', event)" class="flex items-center gap-1.5 px-3 py-1 bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-800/50 rounded-full text-cyan-200 transition">
                                    <span>❤️</span> <span id="feed-likes-${post.id}">${post.likes || 0}</span>
                                </button>
                                <span class="text-slate-500 px-1">👁️ ${post.views || 0}</span>
                                <button onclick="toggleQuickComment('${post.id}', event)" class="flex items-center gap-1.5 px-3 py-1 bg-cyan-950/80 hover:bg-cyan-900/80 border border-cyan-800/50 rounded-full text-cyan-200 transition">
                                    <span>💬</span> <span id="feed-comments-count-${post.id}">${commentCount}</span>
                                </button>
                            </div>
                        </div>

                        <div id="quick-comment-box-${post.id}" class="hidden pl-12 mt-3 pt-3 border-t border-cyan-950/60">
                            <form onsubmit="submitQuickComment(event, '${post.id}')" class="flex flex-col gap-2 bg-cyan-950/30 p-3 rounded-lg border border-cyan-900/40">
                                <input type="text" id="quick-user-${post.id}" placeholder="Your name (optional)" class="bg-cyan-950/60 border border-cyan-900/60 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                                <div class="flex gap-2">
                                    <input type="text" id="quick-text-${post.id}" placeholder="Write a comment..." required class="flex-1 bg-cyan-950/60 border border-cyan-900/60 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded text-xs transition">Send</button>
                                </div>
                            </form>
                        </div>
                    </article>
                `;
            });

            html += `</div></section>`;
            container.innerHTML = html;
        }

        async function inlineLike(id, event) {
            if (event) event.stopPropagation();
            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/like`, { 
                    method: 'POST',
                    headers: getHeaders()
                });
                const data = await res.json();
                if (data.success) {
                    const el = document.getElementById(`feed-likes-${id}`);
                    if (el) el.innerText = data.likes;
                    const p = currentPosts.find(x => x.id === id);
                    if (p) p.likes = data.likes;
                } else {
                    alert(data.message || "You have already liked this post.");
                }
            } catch (e) {}
        }

        function toggleQuickComment(id, event) {
            if (event) event.stopPropagation();
            const box = document.getElementById(`quick-comment-box-${id}`);
            if (box) {
                box.classList.toggle('hidden');
            }
        }

        async function submitQuickComment(e, id) {
            e.preventDefault();
            e.stopPropagation();

            const userVal = document.getElementById(`quick-user-${id}`).value.trim();
            const textVal = document.getElementById(`quick-text-${id}`).value.trim();

            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/comment`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ user: userVal, text: textVal })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById(`quick-text-${id}`).value = '';
                    const countEl = document.getElementById(`feed-comments-count-${id}`);
                    if (countEl) countEl.innerText = data.comments.length;

                    const p = currentPosts.find(x => x.id === id);
                    if (p) p.comments = data.comments;

                    const box = document.getElementById(`quick-comment-box-${id}`);
                    if (box) box.classList.add('hidden');
                } else {
                    alert(data.message || "You have already commented on this post.");
                }
            } catch (e) {}
        }

        async function openFullArticle(id) {
            const post = currentPosts.find(p => p.id === id);
            if (!post) return;
            activePostId = id;

            window.history.pushState({ postId: id }, '', `?id=${id}`);

            document.getElementById('article-header').innerHTML = `
                <span class="text-xs uppercase tracking-wider text-cyan-400 font-mono font-semibold block mb-3">${post.category}</span>
                <h1 class="font-serif text-4xl md:text-5xl font-semibold leading-tight mb-4 text-white">${post.title}</h1>
            `;
            
            const cleanedContent = sanitizeBlogHtml(post.content);
            document.getElementById('article-body').innerHTML = cleanedContent || `<p class="italic text-muted font-serif">No content available.</p>`;
            document.getElementById('like-count').innerText = post.likes || 0;
            document.getElementById('view-count').innerText = `${post.views || 0} views`;
            
            renderComments(post.comments || []);

            document.getElementById('feed-view').classList.add('hidden');
            document.getElementById('article-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/view`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('view-count').innerText = `${data.views} views`;
                    post.views = data.views;
                }
            } catch (e) {}

            document.getElementById('like-btn').onclick = () => handleLike(id);
        }

        function showFeedView() {
            document.getElementById('article-view').classList.add('hidden');
            document.getElementById('feed-view').classList.remove('hidden');
            activePostId = null;
            window.history.pushState({}, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderEditorialLayout(currentPosts);
        }

        function checkUrlForPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            if (postId && currentPosts.some(p => p.id === postId)) {
                openFullArticle(postId);
            }
        }

        async function handleLike(id) {
            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/like`, { 
                    method: 'POST',
                    headers: getHeaders()
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('like-count').innerText = data.likes;
                    const p = currentPosts.find(x => x.id === id);
                    if (p) p.likes = data.likes;
                } else {
                    alert(data.message || "You have already liked this post.");
                }
            } catch (e) {}
        }

        function renderComments(comments) {
            const list = document.getElementById('comments-list');
            if (!comments.length) {
                list.innerHTML = `<p class="text-xs text-muted italic">No comments yet.</p>`;
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="bg-cyan-950/40 border border-cyan-900/40 p-3 rounded-lg text-xs">
                    <span class="font-semibold text-cyan-300">${escapeHtml(c.user)}</span>
                    <p class="text-slate-300 mt-1">${escapeHtml(c.text)}</p>
                </div>
            `).join('');
        }

        async function submitComment(e) {
            e.preventDefault();
            if (!activePostId) return;

            const userVal = document.getElementById('comment-user').value.trim();
            const textVal = document.getElementById('comment-text').value.trim();

            try {
                const res = await fetch(`${API_URL}/api/posts/${activePostId}/comment`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ user: userVal, text: textVal })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('comment-text').value = '';
                    renderComments(data.comments);
                    const p = currentPosts.find(x => x.id === activePostId);
                    if (p) p.comments = data.comments;
                } else {
                    alert(data.message || "You have already commented on this post.");
                }
            } catch (e) {}
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onpopstate = (event) => {
            if (event.state && event.state.postId) {
                openFullArticle(event.state.postId);
            } else {
                showFeedView();
            }
        };

        window.onload = () => {
            updateOwnerBadge();
            fetchPosts();
        };
    </script>
</body>
</html>
