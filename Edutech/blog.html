<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduByte — Tech & AI Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F7F4EE',
                        ink: '#1C1917',
                        terracotta: '#B85032',
                        muted: '#78716C'
                    },
                    fontFamily: {
                        serif: ['Newsreader', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #F7F4EE; 
            color: #1C1917; 
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 12px 12px;
        }

        /* Typography inside Full Page Article View */
        .blog-content { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            line-height: 1.8; 
            color: #292524; 
            font-size: 1.1rem; 
        }
        .blog-content p { margin-bottom: 1.5rem; }
        .blog-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 2rem auto; display: block; }
        .blog-content h1, .blog-content h2, .blog-content h3 { 
            font-family: 'Newsreader', serif; 
            color: #1C1917; 
            font-weight: 600; 
            margin-top: 2.5rem; 
            margin-bottom: 1rem; 
        }
        .blog-content h2 { font-size: 1.85rem; }
        .blog-content code { background: #E7E5E4; color: #B85032; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .blog-content pre { background: #1C1917; color: #F7F4EE; padding: 1.25rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.5rem; }
        .blog-content pre code { background: transparent; color: inherit; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-stone-300 selection:text-black">

    <div class="max-w-4xl mx-auto px-6 py-10 md:py-16 w-full flex-1">
        
        <!-- MAIN FEED VIEW -->
        <div id="feed-view">
            <!-- Header Navigation -->
            <header class="flex justify-between items-center mb-12 pb-6 border-b border-stone-300">
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-xs uppercase font-mono tracking-wider text-muted hover:text-terracotta transition">← Profile</a>
                    <span class="text-stone-300">•</span>
                    <h1 class="font-serif text-2xl font-semibold tracking-tight text-ink">EduByte</h1>
                </div>
                <span class="text-xs uppercase tracking-widest text-terracotta font-semibold">Tech & AI Insights</span>
            </header>

            <!-- Dynamic Feed Container -->
            <main id="feed-container">
                <div class="animate-pulse space-y-8 py-10">
                    <div class="h-4 bg-stone-200 rounded w-1/4"></div>
                    <div class="h-10 bg-stone-200 rounded w-3/4"></div>
                    <div class="h-20 bg-stone-200 rounded w-full"></div>
                </div>
            </main>
        </div>

        <!-- FULL PAGE ARTICLE VIEW (Initially Hidden) -->
        <article id="article-view" class="hidden">
            <!-- Sticky Back Bar -->
            <div class="mb-8 pb-4 border-b border-stone-300 flex items-center justify-between">
                <button onclick="showFeedView()" class="inline-flex items-center gap-2 text-sm font-semibold text-terracotta hover:underline">
                    ← Back to all articles
                </button>
                <a href="index.html" class="text-xs font-mono uppercase text-muted hover:text-ink">Main Profile</a>
            </div>

            <!-- Article Content Header -->
            <header id="article-header" class="mb-10"></header>

            <!-- Article Body -->
            <div id="article-body" class="blog-content mb-16 border-b border-stone-300 pb-12"></div>

            <!-- Interactive Actions & Comments -->
            <section class="max-w-2xl mx-auto space-y-8">
                <div class="flex items-center justify-between bg-[#FAF8F5] border border-stone-300 p-4 rounded-lg">
                    <button id="like-btn" class="flex items-center gap-2 bg-terracotta text-white px-5 py-2 rounded-md text-sm font-medium hover:bg-[#A04328] transition">
                        <span>❤️</span> <span id="like-count">0</span> Likes
                    </button>
                    <span id="view-count" class="text-xs text-muted font-mono">0 views</span>
                </div>

                <!-- Discussion -->
                <div class="space-y-6 pt-4">
                    <h3 class="font-serif text-2xl font-semibold text-ink">Discussion</h3>
                    <div id="comments-list" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div>

                    <form id="comment-form" onsubmit="submitComment(event)" class="flex flex-col gap-3 bg-[#FAF8F5] border border-stone-300 p-4 rounded-lg">
                        <input type="text" id="comment-user" placeholder="Your name (optional)" class="bg-white border border-stone-300 rounded-md px-3 py-2 text-sm text-ink focus:outline-none focus:border-terracotta">
                        <div class="flex gap-2">
                            <input type="text" id="comment-text" placeholder="Write a comment..." required class="flex-1 bg-white border border-stone-300 rounded-md px-3 py-2 text-sm text-ink focus:outline-none focus:border-terracotta">
                            <button type="submit" class="bg-terracotta text-white px-5 py-2 rounded-md text-sm font-medium hover:bg-[#A04328] transition">Post</button>
                        </div>
                    </form>
                </div>
            </section>
        </article>

    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-6 py-8 w-full border-t border-stone-300 flex justify-between items-center text-xs text-muted font-sans">
        <span>© 2026 Ayush Singh Rathor</span>
        <a href="index.html" class="hover:underline">Profile Page</a>
    </footer>

    <script>
        const API_URL = 'https://edubyte-backend-x0up.onrender.com';
        let currentPosts = [];
        let activePostId = null;

        function sanitizeBlogHtml(htmlStr) {
            if (!htmlStr) return '';
            return htmlStr
                .replace(/\\n/g, ' ')
                .replace(/\\"/g, '"')
                .replace(/style="[^"]*"/gi, '')
                .trim();
        }

        function cleanSnippetText(text) {
            if (!text) return '';
            return text
                .replace(/^.*?---/g, '')
                .replace(/Ayush Singh Rathor.*?(VIT|student)/gi, '')
                .replace(/^.*?\?--/g, '')
                .replace(/^[\s\-–—:\.]+/g, '')
                .trim();
        }

        async function fetchPosts() {
            const container = document.getElementById('feed-container');
            try {
                const res = await fetch(`${API_URL}/api/posts`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();
                if (data.success && data.posts.length > 0) {
                    currentPosts = data.posts;
                    renderEditorialLayout(data.posts);
                    checkUrlForPost();
                } else {
                    container.innerHTML = `<p class="text-muted font-serif py-10 text-center">No posts available.</p>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="text-center py-12 space-y-3">
                        <p class="text-stone-700 font-serif text-lg">Unable to load feed from server.</p>
                        <p class="text-xs text-stone-500 font-mono">${err.message}</p>
                        <button onclick="fetchPosts()" class="bg-terracotta text-white text-xs px-4 py-2 rounded-md hover:bg-[#A04328] transition">Retry</button>
                    </div>
                `;
            }
        }

        function renderEditorialLayout(posts) {
            const container = document.getElementById('feed-container');
            const featured = posts[0];

            let html = `
                <!-- Featured Entry -->
                <section class="mb-16 cursor-pointer group bg-[#FAF8F5] border border-stone-300 p-8 rounded-xl hover:border-terracotta transition shadow-sm" onclick="openFullArticle('${featured.id}')">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-xs text-terracotta uppercase tracking-wider font-mono font-semibold">Latest Entry</span>
                    </div>
                    <h2 class="font-serif text-4xl md:text-5xl font-semibold leading-tight tracking-tight mb-4 text-ink group-hover:text-terracotta transition">${featured.title}</h2>
                    <p class="text-stone-700 text-lg font-serif italic mb-6 max-w-2xl">${cleanSnippetText(featured.snippet)}</p>
                    <div class="flex items-center gap-3 text-xs text-muted">
                        <span class="text-terracotta font-semibold">Read full article →</span>
                        <span>•</span>
                        <span class="bg-stone-200 text-stone-800 px-2.5 py-1 rounded-md font-sans">${featured.category}</span>
                    </div>
                </section>

                <!-- All Entries List -->
                <section>
                    <h3 class="text-xs uppercase tracking-widest text-muted font-medium mb-8 pb-3 border-b border-stone-300">All Entries</h3>
                    <div class="space-y-6">
            `;

            posts.forEach((post, idx) => {
                const num = String(idx + 1).padStart(2, '0');
                html += `
                    <article class="flex gap-6 items-start group cursor-pointer bg-[#FAF8F5] border border-stone-300 p-6 rounded-lg hover:border-terracotta transition" onclick="openFullArticle('${post.id}')">
                        <span class="font-serif text-terracotta text-lg md:text-xl font-bold w-6 shrink-0">${num}</span>
                        <div class="space-y-2 flex-1">
                            <h4 class="font-serif text-2xl md:text-3xl font-semibold leading-snug text-ink group-hover:text-terracotta transition">${post.title}</h4>
                            <p class="text-stone-600 text-sm md:text-base font-serif italic">${cleanSnippetText(post.snippet)}</p>
                            <div class="pt-2 flex items-center gap-2">
                                <span class="inline-block bg-stone-200 text-stone-800 px-2.5 py-0.5 rounded-md text-xs">${post.category}</span>
                            </div>
                        </div>
                    </article>
                `;
            });

            html += `</div></section>`;
            container.innerHTML = html;
        }

        async function openFullArticle(id) {
            const post = currentPosts.find(p => p.id === id);
            if (!post) return;
            activePostId = id;

            // Set URL parameter without reloading page
            window.history.pushState({ postId: id }, '', `?id=${id}`);

            // Populate Article Elements
            document.getElementById('article-header').innerHTML = `
                <span class="text-xs uppercase tracking-wider text-terracotta font-mono font-semibold block mb-3">${post.category}</span>
                <h1 class="font-serif text-4xl md:text-6xl font-semibold leading-tight mb-4 text-ink">${post.title}</h1>
            `;
            
            const cleanedContent = sanitizeBlogHtml(post.content);
            document.getElementById('article-body').innerHTML = cleanedContent || `<p class="italic text-muted font-serif">No content available.</p>`;
            document.getElementById('like-count').innerText = post.likes || 0;
            document.getElementById('view-count').innerText = `${post.views || 0} views`;
            
            renderComments(post.comments || []);

            // Switch views
            document.getElementById('feed-view').classList.add('hidden');
            document.getElementById('article-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Increment views
            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/view`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('view-count').innerText = `${data.views} views`;
                    post.views = data.views;
                }
            } catch (e) {}

            document.getElementById('like-btn').onclick = () => handleLike(id);
        }

        function showFeedView() {
            document.getElementById('article-view').classList.add('hidden');
            document.getElementById('feed-view').classList.remove('hidden');
            activePostId = null;
            window.history.pushState({}, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkUrlForPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            if (postId && currentPosts.some(p => p.id === postId)) {
                openFullArticle(postId);
            }
        }

        async function handleLike(id) {
            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/like`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('like-count').innerText = data.likes;
                    const p = currentPosts.find(x => x.id === id);
                    if (p) p.likes = data.likes;
                }
            } catch (e) {}
        }

        function renderComments(comments) {
            const list = document.getElementById('comments-list');
            if (!comments.length) {
                list.innerHTML = `<p class="text-xs text-muted italic">No comments yet.</p>`;
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="bg-[#FAF8F5] border border-stone-300 p-3 rounded-md text-xs">
                    <span class="font-semibold text-terracotta">${escapeHtml(c.user)}</span>
                    <p class="text-stone-700 mt-1">${escapeHtml(c.text)}</p>
                </div>
            `).join('');
        }

        async function submitComment(e) {
            e.preventDefault();
            if (!activePostId) return;

            const userVal = document.getElementById('comment-user').value.trim();
            const textVal = document.getElementById('comment-text').value.trim();

            try {
                const res = await fetch(`${API_URL}/api/posts/${activePostId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: userVal, text: textVal })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('comment-text').value = '';
                    renderComments(data.comments);
                    const p = currentPosts.find(x => x.id === activePostId);
                    if (p) p.comments = data.comments;
                }
            } catch (e) {}
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onpopstate = (event) => {
            if (event.state && event.state.postId) {
                openFullArticle(event.state.postId);
            } else {
                showFeedView();
            }
        };

        window.onload = fetchPosts;
    </script>
</body>
</html>
