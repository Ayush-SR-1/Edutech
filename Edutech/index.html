<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduByte — Tech & AI Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F4F1EA',
                        ink: '#1A1A1A',
                        muted: '#6B6861'
                    },
                    fontFamily: {
                        serif: ['Newsreader', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #F4F1EA; 
            color: #1A1A1A; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.05) 0px, transparent 50%),
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            background-attachment: fixed;
        }
        
        /* Typography inside Article Modal */
        .blog-content { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            line-height: 1.8; 
            color: #2D2B2A; 
            font-size: 1.05rem; 
        }
        .blog-content p { margin-bottom: 1.25rem; }
        .blog-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1.5rem auto; display: block; }
        .blog-content h1, .blog-content h2, .blog-content h3 { 
            font-family: 'Newsreader', serif; 
            color: #1A1A1A; 
            font-weight: 600; 
            margin-top: 2rem; 
            margin-bottom: 0.75rem; 
        }
        .blog-content h2 { font-size: 1.65rem; }
        .blog-content code { background: #E6E2D8; color: #1A1A1A; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; }
        .blog-content pre { background: #1A1A1A; color: #F4F1EA; padding: 1.25rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1.5rem; }
        .blog-content pre code { background: transparent; color: inherit; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen selection:bg-neutral-300">

    <div class="max-w-4xl mx-auto px-6 py-12 md:py-16">
        <!-- Header -->
        <header class="flex justify-between items-center mb-16 pb-6 border-b border-stone-300/80">
            <div class="flex items-center gap-3">
                <h1 class="font-serif text-2xl font-semibold tracking-tight">EduByte</h1>
                <span class="text-[10px] font-mono tracking-wider uppercase bg-stone-200/80 text-stone-600 px-2 py-0.5 rounded border border-stone-300">Tech & AI</span>
            </div>
            <span class="text-xs uppercase tracking-widest text-muted font-medium">Everyday Insights</span>
        </header>

        <!-- Dynamic Feed Container -->
        <main id="feed-container">
            <div class="animate-pulse space-y-8">
                <div class="h-4 bg-stone-300/60 rounded w-1/4"></div>
                <div class="h-10 bg-stone-300/60 rounded w-3/4"></div>
                <div class="h-20 bg-stone-300/60 rounded w-full"></div>
            </div>
        </main>
    </div>

    <!-- Article Reader Modal -->
    <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 md:p-6 overflow-y-auto">
        <div class="bg-cream max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-xl border border-stone-300 shadow-2xl p-6 md:p-10 relative my-8">
            
            <!-- Navigation Header in Modal -->
            <div class="flex items-center justify-between pb-4 border-b border-stone-300 mb-6">
                <button onclick="closeModal()" class="flex items-center gap-2 text-sm text-stone-600 hover:text-ink font-medium transition">
                    <span>←</span> Back to all entries
                </button>
                <button onclick="closeModal()" class="text-muted hover:text-ink text-lg font-mono">✕</button>
            </div>
            
            <div id="modal-header"></div>
            <div id="modal-body" class="blog-content pt-4 my-6"></div>
            
            <!-- Dynamic Actions -->
            <div id="modal-footer" class="border-t border-stone-300 pt-6 mt-8">
                <div class="flex items-center justify-between mb-8">
                    <button id="like-btn" class="flex items-center gap-2 border border-stone-300 hover:border-stone-400 bg-cream px-4 py-2 rounded-full text-sm font-medium transition">
                        <span>❤️</span> <span id="like-count">0</span> Likes
                    </button>
                    <span id="view-count" class="text-xs text-muted">0 views</span>
                </div>

                <!-- Comments -->
                <div class="space-y-4">
                    <h4 class="font-serif text-lg font-medium">Discussion</h4>
                    <div id="comments-list" class="space-y-3 mb-4 max-h-48 overflow-y-auto pr-2"></div>
                    
                    <form id="comment-form" onsubmit="submitComment(event)" class="flex flex-col gap-2">
                        <input type="text" id="comment-user" placeholder="Your name (optional)" class="bg-stone-200/60 border border-stone-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-stone-500">
                        <div class="flex gap-2">
                            <input type="text" id="comment-text" placeholder="Write a comment..." required class="flex-1 bg-stone-200/60 border border-stone-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-stone-500">
                            <button type="submit" class="bg-ink text-cream px-4 py-2 rounded-lg text-sm font-medium hover:bg-neutral-800 transition">Post</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://edubyte-backend-x0up.onrender.com';
        let currentPosts = [];
        let activePostId = null;

        function sanitizeBlogHtml(htmlStr) {
            if (!htmlStr) return '';
            return htmlStr
                .replace(/\\n/g, ' ')
                .replace(/\\"/g, '"')
                .replace(/style="[^"]*"/gi, '')
                .trim();
        }

        function cleanSnippetText(text) {
            if (!text) return '';
            return text
                .replace(/^.*?---/g, '')
                .replace(/Ayush Singh Rathor.*?(VIT|student)/gi, '')
                .replace(/^.*?\?--/g, '')
                .replace(/^[\s\-–—:\.]+/g, '')
                .trim();
        }

        async function fetchPosts() {
            const container = document.getElementById('feed-container');
            try {
                const res = await fetch(`${API_URL}/api/posts`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const data = await res.json();
                if (data.success && data.posts.length > 0) {
                    currentPosts = data.posts;
                    renderEditorialLayout(data.posts);
                } else {
                    container.innerHTML = `<p class="text-muted font-serif py-10 text-center">No posts available.</p>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="text-center py-12 space-y-3">
                        <p class="text-stone-700 font-serif text-lg">Unable to load feed from server.</p>
                        <p class="text-xs text-stone-500 font-mono">${err.message}</p>
                        <button onclick="fetchPosts()" class="bg-ink text-cream text-xs px-4 py-2 rounded-md hover:bg-neutral-800 transition">Retry</button>
                    </div>
                `;
            }
        }

        function renderEditorialLayout(posts) {
            const container = document.getElementById('feed-container');
            const featured = posts[0];

            let html = `
                <!-- Featured Entry -->
                <section class="mb-20 cursor-pointer group" onclick="openModal('${featured.id}')">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                        <span class="text-xs text-muted uppercase tracking-wider font-medium">Latest Tech & AI Entry</span>
                    </div>
                    <h2 class="font-serif text-4xl md:text-5xl font-normal leading-tight tracking-tight mb-4 group-hover:underline underline-offset-4 decoration-stone-400">${featured.title}</h2>
                    <p class="text-stone-600 text-lg font-serif italic mb-4 max-w-2xl">${cleanSnippetText(featured.snippet)}</p>
                    <div class="flex items-center gap-3 text-xs text-muted">
                        <span>Read article</span>
                        <span>•</span>
                        <span class="bg-stone-200/80 px-2.5 py-1 rounded-full text-stone-700 font-sans">${featured.category}</span>
                    </div>
                </section>

                <!-- All Entries List -->
                <section>
                    <h3 class="text-xs uppercase tracking-widest text-muted font-medium mb-8 pb-3 border-b border-stone-300">All entries, in order</h3>
                    <div class="space-y-12">
            `;

            posts.forEach((post, idx) => {
                const num = String(idx + 1).padStart(2, '0');
                html += `
                    <article class="flex gap-6 items-start group cursor-pointer" onclick="openModal('${post.id}')">
                        <span class="font-serif text-stone-400 text-lg md:text-xl font-light w-6 shrink-0">${num}</span>
                        <div class="space-y-2 flex-1">
                            <h4 class="font-serif text-2xl md:text-3xl font-normal leading-snug group-hover:underline underline-offset-4 decoration-stone-400">${post.title}</h4>
                            <p class="text-stone-600 text-sm md:text-base font-serif italic">${cleanSnippetText(post.snippet)}</p>
                            <div class="pt-1 flex items-center gap-2">
                                <span class="inline-block bg-stone-200/80 px-2.5 py-0.5 rounded-full text-xs text-stone-700">${post.category}</span>
                            </div>
                        </div>
                    </article>
                `;
            });

            html += `</div></section>`;
            container.innerHTML = html;
        }

        async function openModal(id) {
            const post = currentPosts.find(p => p.id === id);
            if (!post) return;
            activePostId = id;

            document.getElementById('modal-header').innerHTML = `
                <span class="text-xs uppercase tracking-wider text-muted block mb-2">${post.category}</span>
                <h2 class="font-serif text-3xl md:text-4xl font-normal leading-snug mb-2">${post.title}</h2>
            `;
            
            const cleanedContent = sanitizeBlogHtml(post.content);
            document.getElementById('modal-body').innerHTML = cleanedContent || `<p class="italic text-muted font-serif">No content available.</p>`;
            document.getElementById('like-count').innerText = post.likes || 0;
            document.getElementById('view-count').innerText = `${post.views || 0} views`;
            
            renderComments(post.comments || []);
            document.getElementById('modal').classList.remove('hidden');

            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/view`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('view-count').innerText = `${data.views} views`;
                    post.views = data.views;
                }
            } catch (e) {}

            document.getElementById('like-btn').onclick = () => handleLike(id);
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            activePostId = null;
        }

        async function handleLike(id) {
            try {
                const res = await fetch(`${API_URL}/api/posts/${id}/like`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('like-count').innerText = data.likes;
                    const p = currentPosts.find(x => x.id === id);
                    if (p) p.likes = data.likes;
                }
            } catch (e) {}
        }

        function renderComments(comments) {
            const list = document.getElementById('comments-list');
            if (!comments.length) {
                list.innerHTML = `<p class="text-xs text-muted italic">No comments yet.</p>`;
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="bg-stone-200/50 p-3 rounded-lg text-xs">
                    <span class="font-semibold text-ink">${escapeHtml(c.user)}</span>
                    <p class="text-stone-700 mt-1">${escapeHtml(c.text)}</p>
                </div>
            `).join('');
        }

        async function submitComment(e) {
            e.preventDefault();
            if (!activePostId) return;

            const userVal = document.getElementById('comment-user').value.trim();
            const textVal = document.getElementById('comment-text').value.trim();

            try {
                const res = await fetch(`${API_URL}/api/posts/${activePostId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: userVal, text: textVal })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('comment-text').value = '';
                    renderComments(data.comments);
                    const p = currentPosts.find(x => x.id === activePostId);
                    if (p) p.comments = data.comments;
                }
            } catch (e) {}
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = fetchPosts;
    </script>
</body>
</html>
